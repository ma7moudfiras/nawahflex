<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2A41">
<!-- صفحة أداة لا محتوى: لا تُفهرس. يفتحها رمز QR المطبوع على الشهادة. -->
<meta name="robots" content="noindex">
<title>التحقّق من شهادة — أكاديمية نواة</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css?v=2">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
    font-family: var(--f-body); color: var(--c-text); background: var(--c-paper);
  }
  .card {
    width: 100%; max-width: 520px; background: var(--c-card); border: 1px solid var(--c-border);
    border-radius: var(--r-lg); padding: 2rem 1.5rem; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: .9rem;
  }
  .mark { width: 96px; height: auto; color: var(--c-ink); }
  .mark .dot { fill: var(--c-accent); }
  h1 { font-family: var(--f-display); font-weight: 800; font-size: var(--t-2xl); line-height: 1.3; }
  p { line-height: 1.9; color: var(--c-text-soft); }
  .badge {
    display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .9rem; border-radius: var(--r-full);
    font-weight: 700; font-size: var(--t-sm);
  }
  .ok  { background: var(--c-ok-soft);  color: var(--c-ok); }
  .bad { background: var(--c-err-soft); color: var(--c-err); }
  .badge svg { width: 1.1em; height: 1.1em; }
  .name { font-family: var(--f-display); font-weight: 800; font-size: var(--t-xl); color: var(--c-ink); }
  .title { font-weight: 600; color: var(--c-ink); }
  .meta { font-size: var(--t-sm); color: var(--c-text-muted); }
  .code { direction: ltr; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; color: var(--c-accent-ink); }
  form { display: flex; gap: .5rem; width: 100%; margin-block-start: .5rem; }
  input {
    flex: 1; min-height: 48px; padding-inline: 1rem; border: 1px solid var(--c-border); border-radius: var(--r-md);
    font: inherit; direction: ltr; text-align: center; text-transform: uppercase; letter-spacing: .08em;
    background: var(--c-card); color: var(--c-text);
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; }
  button, .btn {
    min-height: 48px; padding-inline: 1.4rem; border: 0; border-radius: var(--r-full); cursor: pointer;
    background: var(--c-ink); color: var(--c-text-invert); font: inherit; font-weight: 600; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  button:hover, .btn:hover { background: var(--c-ink-deep); }
  .home { font-size: var(--t-sm); color: var(--c-text-muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="card" aria-live="polite">
    <svg class="mark" viewBox="-564 -1619 2685 2440" aria-hidden="true"><path d="M955 -1192 L1654 -1192 A300 300 0 0 1 1954 -892 L1954 -892" fill="none" stroke="currentColor" stroke-width="174"/><path d="M1954 90 L1954 354 A300 300 0 0 1 1654 654 L-98 654 A300 300 0 0 1 -398 354 L-398 -892 A300 300 0 0 1 -98 -1192 L601 -1192" fill="none" stroke="currentColor" stroke-width="174"/><rect x="691" y="-1539" width="174" height="1539" fill="currentColor"/><path d="M21 -290 A290 290 0 1 0 601 -290 A290 290 0 1 0 21 -290 Z M193 -290 A118 118 0 1 1 429 -290 A118 118 0 1 1 193 -290 Z" fill="currentColor" fill-rule="evenodd"/><circle class="dot" cx="226" cy="-726" r="76"/><circle class="dot" cx="396" cy="-726" r="76"/><path d="M955 -290 A290 290 0 1 0 1535 -290 A290 290 0 1 0 955 -290 Z M1127 -290 A118 118 0 1 1 1363 -290 A118 118 0 1 1 1127 -290 Z" fill="currentColor" fill-rule="evenodd"/><path d="M1954 -560 L1954 -307 A220 220 0 0 1 1734 -87 L1361 -87" fill="none" stroke="currentColor" stroke-width="174"/><path d="M1448 -290 L1448 90 A220 220 0 0 1 1228 310 L409 310 A220 220 0 0 1 189 90 L189 88" fill="none" stroke="currentColor" stroke-width="174"/><circle class="dot" cx="1954" cy="-726" r="76"/></svg>

    <h1>التحقّق من شهادة</h1>
    <div id="result"></div>

    <form id="form" hidden>
      <label for="code" class="meta" style="position:absolute;inline-size:1px;block-size:1px;overflow:hidden">رقم الشهادة</label>
      <input id="code" name="c" placeholder="NW-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="12">
      <button type="submit">تحقّق</button>
    </form>

    <a class="home" href="/">أكاديمية نواة — كل اختراع يبدأ بنواة</a>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    (function () {
      // كل نص من القاعدة يمرّ بـ esc قبل حقنه — نفس قاعدة main.js.
      const esc = (str) => String(str ?? "").replace(/[&<>"']/g,
        (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

      const $result = document.getElementById("result");
      const $form = document.getElementById("form");
      const $code = document.getElementById("code");
      const CODE = /^NW-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
      const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

      const show = (html) => { $result.innerHTML = html; };
      // نفس صيغة التاريخ المطبوعة على الشهادة (pdfDate في التطبيق) — لا Intl
      // الذي يكتب «أكتوبر» فيختلف عمّا في يد صاحب الشهادة.
      const MONTHS = ["كانون الثاني", "شباط", "آذار", "نيسان", "أيار", "حزيران",
        "تموز", "آب", "أيلول", "تشرين الأول", "تشرين الثاني", "كانون الأول"];
      const fmtDate = (iso) => {
        const d = new Date(iso);
        return isNaN(d) ? String(iso).slice(0, 10) : d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
      };

      async function verify(raw) {
        const code = String(raw || "").trim().toUpperCase();
        if (!CODE.test(code)) {
          show('<p>اكتب رقم الشهادة كما هو مطبوع عليها، بالشكل <span class="code">NW-XXXX-XXXX</span>.</p>');
          $form.hidden = false;
          return;
        }
        show('<p class="meta">جارٍ التحقّق…</p>');
        try {
          const rows = await window.API.rpc("verify_certificate", { p_code: code });
          const c = rows && rows[0];
          if (!c) {
            show('<span class="badge bad">' + CROSS + 'لا توجد شهادة بهذا الرقم</span>' +
                 '<p>تأكّد من الرقم المطبوع، أو تواصل مع الأكاديمية.</p><p class="code">' + esc(code) + '</p>');
          } else if (c.revoked) {
            show('<span class="badge bad">' + CROSS + 'هذه الشهادة أُلغيت</span>' +
                 '<p class="name">' + esc(c.student_name) + '</p><p class="title">' + esc(c.title) + '</p>' +
                 '<p class="code">' + esc(code) + '</p>');
          } else {
            show('<span class="badge ok">' + CHECK + 'شهادة صحيحة صادرة عن أكاديمية نواة</span>' +
                 '<p class="name">' + esc(c.student_name) + '</p><p class="title">' + esc(c.title) + '</p>' +
                 '<p class="meta">صدرت في ' + esc(fmtDate(c.issued_at)) + '</p><p class="code">' + esc(code) + '</p>');
          }
          $form.hidden = true;
        } catch (_) {
          show('<p>تعذّر الاتصال بخادم الأكاديمية الآن. حاول بعد قليل.</p>');
          $form.hidden = false;
        }
      }

      $form.addEventListener("submit", (e) => {
        e.preventDefault();
        const code = $code.value.trim().toUpperCase();
        history.replaceState(null, "", "?c=" + encodeURIComponent(code));
        verify(code);
      });

      const fromUrl = new URLSearchParams(location.search).get("c");
      if (fromUrl) { $code.value = fromUrl; verify(fromUrl); }
      else { show("<p>أدخل رقم الشهادة المطبوع أسفلها.</p>"); $form.hidden = false; }
    })();
  </script>
</body>
</html>
