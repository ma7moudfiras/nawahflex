<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2A41">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — أكاديمية نواة</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css?v=2">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 2rem;
    font-family: var(--f-body); color: var(--c-text); background: var(--c-paper); text-align: center;
  }
  .wrap { max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .mark { width: 180px; height: auto; margin-block-end: 1rem; }
  /* الروبوت يبحث عن الصفحة: العينان تتلفّتان يميناً ويساراً */
  .mark .eye { transform-box: fill-box; transform-origin: center; animation: look 3.2s ease-in-out infinite; }
  @keyframes look { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-6%); } 70% { transform: translateX(6%); } }
  .code { font-family: var(--f-display); font-weight: 800; font-size: var(--t-sm); color: var(--c-accent-ink); direction: ltr; }
  h1 { font-family: var(--f-display); font-weight: 800; font-size: var(--t-3xl); line-height: 1.25; }
  p { line-height: 1.9; color: var(--c-text-soft); }
  .btn {
    display: inline-flex; align-items: center; min-height: 52px; padding: .9rem 1.8rem; margin-block-start: .75rem;
    border-radius: var(--r-full); background: var(--c-ink); color: var(--c-text-invert);
    font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: var(--c-ink-deep); }
  .btn:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .mark .eye { animation: none; } }
</style>
</head>
<body>
  <main class="wrap">
    <svg class="mark" viewBox="-564 -1619 2685 2440" aria-hidden="true"><path d="M955 -1192 L1654 -1192 A300 300 0 0 1 1954 -892 L1954 -892" fill="none" stroke="#1B2A41" stroke-width="174"/><path d="M1954 90 L1954 354 A300 300 0 0 1 1654 654 L-98 654 A300 300 0 0 1 -398 354 L-398 -892 A300 300 0 0 1 -98 -1192 L601 -1192" fill="none" stroke="#1B2A41" stroke-width="174"/><rect x="691" y="-1539" width="174" height="1539" fill="#1B2A41"/><g class="eye"><path d="M21 -290 A290 290 0 1 0 601 -290 A290 290 0 1 0 21 -290 Z M193 -290 A118 118 0 1 1 429 -290 A118 118 0 1 1 193 -290 Z" fill="#1B2A41" fill-rule="evenodd"/></g><circle cx="226" cy="-726" r="76" fill="#E2552B"/><circle cx="396" cy="-726" r="76" fill="#E2552B"/><g class="eye"><path d="M955 -290 A290 290 0 1 0 1535 -290 A290 290 0 1 0 955 -290 Z M1127 -290 A118 118 0 1 1 1363 -290 A118 118 0 1 1 1127 -290 Z" fill="#1B2A41" fill-rule="evenodd"/></g><path d="M1954 -560 L1954 -307 A220 220 0 0 1 1734 -87 L1361 -87" fill="none" stroke="#1B2A41" stroke-width="174"/><path d="M1448 -290 L1448 90 A220 220 0 0 1 1228 310 L409 310 A220 220 0 0 1 189 90 L189 88" fill="none" stroke="#1B2A41" stroke-width="174" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="1954" cy="-726" r="76" fill="#E2552B"/></svg>
    <p class="code">404</p>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط الذي وصلت منه لم يعد موجوداً، أو أن في العنوان خطأً مطبعياً.</p>
    <a class="btn" href="/">العودة إلى الرئيسية</a>
  </main>
</body>
</html>
