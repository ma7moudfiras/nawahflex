<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="لوحة إدارة أكاديمية نواة">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- default لا black: مع black يُحسب أول ارتفاع للشاشة على الآيفون (من أيقونة
       الشاشة الرئيسية) أطول من المساحة المرئية فيزاح المحتوى واللمس. ولا
       black-translucent: يرسم تحت شريط الحالة ويحتاج معالجة منطقة آمنة.
       ⚠️ iOS يحفظ هذه القيمة وقت إضافة الأيقونة — من أضافها قبل التغيير
       يحذفها ويضيفها من جديد. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1B2A41">
  <meta name="apple-mobile-web-app-title" content="لوحة نواة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>أكاديمية نواة — لوحة الإدارة</title>

  <!-- نفس خطوط Flutter مسجّلة للمتصفح أيضاً. وراء كل حقل نص على الويب عنصر
       <input> مخفي يحدّد فيه سفاري بنفسه؛ لو لم يعرف المتصفح الخط لرسمه
       بخط آخر، فتقع مقابض التحديد على غير الحروف التي يرسمها Flutter. -->
  <style>
    @font-face { font-family: "IBMPlexSansArabic"; font-weight: 400; font-display: swap; src: url("assets/assets/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype"); }
    @font-face { font-family: "IBMPlexSansArabic"; font-weight: 500; font-display: swap; src: url("assets/assets/fonts/IBMPlexSansArabic-Medium.ttf") format("truetype"); }
    @font-face { font-family: "IBMPlexSansArabic"; font-weight: 600; font-display: swap; src: url("assets/assets/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype"); }
    @font-face { font-family: "IBMPlexSansArabic"; font-weight: 700; font-display: swap; src: url("assets/assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Alexandria"; font-weight: 600; font-display: swap; src: url("assets/assets/fonts/Alexandria-SemiBold.ttf") format("truetype"); }
    @font-face { font-family: "Alexandria"; font-weight: 700; font-display: swap; src: url("assets/assets/fonts/Alexandria-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Alexandria"; font-weight: 800; font-display: swap; src: url("assets/assets/fonts/Alexandria-ExtraBold.ttf") format("truetype"); }
    /* خلفية الإقلاع بلون شاشة الدخول — لا وميض أبيض قبل أول إطار */
    html, body { background: #1B2A41; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
